                        "sitzungsnummer": 100
                    },
                    "nlp_text": "<p>Sehr geehrte Frau Präsidentin!<span class=\"sentiment\">Sentiment: 0.0</span></p><p>Liebe Kolleginnen und Kollegen!<span class=\"sentiment\">Sentiment: 0.7177</span></p><p>Den bisherigen Reden konnten wir entnehmen, dass sich die <mark class=\"ORG_NLP\">AfD</mark> überhaupt nicht für den Verbraucherschutz interessiert und sich stattdessen lieber mit Genderfragen auseinandersetzt <span class=\"kommentar\">(Dr. Götz Frömming [AfD]: Haben Sie überhaupt zugehört? Unsinn!)</span>und dass sich die <mark class=\"LOC_NLP\">Union</mark> letztendlich auch nicht auf die Seite von Verbraucherinnen und Verbrauchern schlägt.<span class=\"sentiment\">Sentiment: 0.1779</span></p><p>Wir tun das als SPD;<span class=\"sentiment\">Sentiment: 0.0</span></p><p>denn uns ist das wichtig.<span class=\"sentiment\">Sentiment: 0.4019</span></p><p><span class=\"kommentar\">(Beifall bei der SPD sowie des Abg. Stephan Thomae [FDP])</span>Meine Damen und Herren, stellen Sie sich vor, Ihre Bank verlangt zu hohe Gebühren von Ihnen, Ihr Internetanbieter hält die vereinbarten Leistungen nicht ein, oder Sie erwerben ein mangelhaftes Produkt.<span class=\"sentiment\">Sentiment: 0.1027</span></p><p>Wenn wir ein paar Jahre zurückdenken, an den Skandal um die Abschalteinrichtungen in <mark class=\"LOC_NLP\">Dieselfahrzeugen – das</mark> wurde schon erwähnt –, so hat dieser Skandal nicht nur international für Aufsehen gesorgt, sondern uns auch den Handlungsbedarf im Hinblick auf Verbraucherrechte aufgezeigt.<span class=\"sentiment\">Sentiment: -0.765</span></p><p><mark class=\"MISC_NLP\">Fakt</mark> ist doch, dass rechtswidriges und verbraucherschädigendes Verhalten von Unternehmen immer wieder vorkommt.<span class=\"sentiment\">Sentiment: -0.34</span></p><p>Und schlimm ist, wenn sie damit durchkommen, weil Verbraucherinnen und Verbraucher sich nicht dagegen wehren.<span class=\"sentiment\">Sentiment: -0.34</span></p><p>Es geht eben nicht nur um Einzelfälle, sondern auch um Fälle, wo massenweise Verbraucherinnen und Verbraucher betroffen sind.<span class=\"sentiment\">Sentiment: 0.0</span></p><p>Es ist schlicht die Pflicht von Unternehmen, sich an Recht und Gesetz zu halten.<span class=\"sentiment\">Sentiment: 0.25</span></p><p>Und wenn sie es nicht tun, dann liegt es in unserem Interesse als Gesellschaft, den Geschädigten zu helfen und dafür zu sorgen, dass sie zu ihrem Recht kommen.<span class=\"sentiment\">Sentiment: 0.6597</span></p><p><span class=\"kommentar\">(Beifall bei der SPD sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN und der FDP)</span>Meine Damen und Herren, wir haben es hier häufig mit einem ungleichen Kräfteverhältnis zu tun – es wurde schon beschrieben –: auf der einen Seite den einzelnen Verbraucher oder die Verbraucherin und auf der anderen Seite häufig das große Unternehmen mit eigener Rechtsabteilung.<span class=\"sentiment\">Sentiment: 0.0258</span></p><p>Natürlich fragen sich die Geschädigten dann auch:<span class=\"sentiment\">Sentiment: 0.0</span></p><p>Habe ich eigentlich die <mark class=\"MISC_NLP\">Zeit</mark> und die Kraft, die Ressourcen und auch das Geld, mich in einem langwierigen, meistens jahrelangen Klageverfahren dagegen aufzulehnen?<span class=\"sentiment\">Sentiment: 0.4939</span></p><p>Häufig ist die Antwort dann: Nein.<span class=\"sentiment\">Sentiment: 0.0</span></p><p>Und das kann ich auch sehr gut nachvollziehen.<span class=\"sentiment\">Sentiment: 0.5256</span></p><p>Deswegen ist es wichtig, an dieser Stelle die Kräfte zu bündeln.<span class=\"sentiment\">Sentiment: 0.7096</span></p><p>Mit der <mark class=\"MISC_NLP\">Musterfeststellungsklage 2018</mark> ist ein richtiger Schritt in diese Richtung gegangen worden;<span class=\"sentiment\">Sentiment: 0.3818</span></p><p>denn es gibt seitdem das unbürokratische Anschließen an Klagen, die bereits von Verbraucherverbänden in die Wege geleitet wurden.<span class=\"sentiment\">Sentiment: -0.4019</span></p><p>Das <mark class=\"LOC_NLP\">Problem</mark> ist – es wurde bereits beschrieben –:<span class=\"sentiment\">Sentiment: -0.2732</span></p><p>Der Schadensersatz muss jedoch noch individuell eingeklagt werden.<span class=\"sentiment\">Sentiment: 0.4767</span></p><p>Die <mark class=\"ORG_NLP\">EU-Verbandsklagenrichtlinie</mark> geht jetzt genau diesen einen fehlenden Schritt weiter und ist deswegen ein Meilenstein im Verbraucherschutz.<span class=\"sentiment\">Sentiment: 0.296</span></p><p><span class=\"kommentar\">(Beifall bei der SPD sowie bei Abgeordneten des BÜNDNISSES 90/DIE GRÜNEN und der FDP)</span>Meine Kollegin <mark class=\"PER_NLP\">Luiza Licina-Bode</mark> hat schon einiges zum Gesetzentwurf gesagt.<span class=\"sentiment\">Sentiment: 0.0</span></p><p>Für mich als Verbraucherpolitikerin ist entscheidend, dass wir die <mark class=\"ORG_NLP\">EU-Richtlinie</mark> möglichst verbraucherfreundlich umsetzen und die Nutzung dieses <mark class=\"LOC_NLP\">Klageverfahrens</mark> auch ermöglichen.<span class=\"sentiment\">Sentiment: 0.3612</span></p><p>Denn genau dafür ist sie auch gedacht: möglichst viele Menschen zu erreichen und damit die Gerichte von Individualklagen zu entlasten.<span class=\"sentiment\">Sentiment: 0.6808</span></p><p>Ich bin froh, dass der <mark class=\"ORG_NLP\">Bundesminister der Justiz</mark> die Kritikpunkte, die es bereits früh gab, aufgenommen hat.<span class=\"sentiment\">Sentiment: 0.4588</span></p><p>Dazu gehörten die Verschiebung des Zeitpunktes, sich dem Verfahren anschließen zu können, und auch die Senkung der Hürden für klageberechtigte Verbände.<span class=\"sentiment\">Sentiment: 0.1027</span></p><p>Aus verbraucherpolitischer Sicht ist allerdings durchaus noch Luft nach oben.<span class=\"sentiment\">Sentiment: 0.0</span></p><p>Die Anzahl der glaubhaft zu machenden Fälle ist aus meiner Sicht mit 50 noch zu hoch;<span class=\"sentiment\">Sentiment: 0.3182</span></p><p>das wird uns auch aus der Praxis so gemeldet.<span class=\"sentiment\">Sentiment: 0.0</span></p><p>Und es sollte auch möglich sein, sich noch nach Abschluss eines Verfahrens im <mark class=\"LOC_NLP\">Nachhinein</mark> und jederzeit anschließen, letztendlich davon profitieren und das eigene Recht geltend machen zu können.<span class=\"sentiment\">Sentiment: 0.6124</span></p><p>Denn geschädigt bleibt nun mal geschädigt.<span class=\"sentiment\">Sentiment: -0.7003</span></p><p>Ich bin deshalb sehr gespannt auf die weiteren Beratungen und bringe mich dabei gerne selbst ein.<span class=\"sentiment\">Sentiment: 0.0</span></p><p>Herzlichen Dank.<span class=\"sentiment\">Sentiment: 0.5719</span></p>",
                    "sentiments": [
                        {
                            "score": 0.1572828571428571,
                            "label": "sentiment"
                        },
                        {
                            "score": 0.05102857142857143,
                            "label": "neg"
                        },
                        {
                            "score": 0.14145714285714284,
                            "label": "pos"
