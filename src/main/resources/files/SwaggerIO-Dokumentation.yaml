openapi: 3.0.3
info:
  title: ParliamentBrowser - OpenAPI 3.0
  version: 1.0.11
  description: The Description of the API of the ParliamentBrowser
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
  - url: http://localhost:4567
paths:
  /abgeordnete:
    description: Eine Seite des Frontends
    get:
      summary: Gibt Java Objekte für Freemarker zurück (alle Abgeordneten)
      parameters:
        - name: vorname
          in: query
          description: Gibt alle Abgeordneten zurück deren Vorname übereinstimmt
          schema:
            type: string
        - name: nachname
          in: query
          description: Gibt alle Abgeordneten zurück deren Nachname übereinstimmt
          schema:
            type: string
      responses:
        "200":
          description: Erfolgreiche Anfrage
      tags:
        - Abgeordnete
  /abgeordnete/{id}:
    description: Eine Seite des Frontends
    get:
      summary: Gibt Java Objekt des Abgeordneten mit der id für Freemarker zurück
      parameters:
        - name: id
          in: path
          required: true
          description: Die id des Anzuzigenen Abgeordneten
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Erfolgreiche Anfrage
      tags:
        - Abgeordnete
  /edit/abgeordneter:
    description: Eine Seite des Frontends die dazu da ist Abgeordnete zu editieren oder anzulegen
    get:
      summary: Gibt Java Objekte für Freemarker zurück (ein Abgeordneter)
      parameters:
        - name: id
          in: query
          description: Wenn mit übergeben, wird der Abgeordnete bearbeitet, sonst ein neuer erstellt
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: Erfolgreiche Anfrage
        "401":
          description: Der user ist nicht eingelogt
        "403":
          description: Der User hat nicht das recht einen abgeordneten zu erstellen bzw. zu editieren
        "404":
          description: die übergebene id führt zu keinem Abgeordneten
      tags:
        - Abgeordnete
  /parliamentbrowser/api/data/representative/save:
    description: API Endpunkt um einen neuen Abgeordeten zu speichern oder die Änderungen an einem zu speichern
    post:
      summary: Die Daten des Abgeordneten werden in die DB gelegt
      requestBody:
        description: Die Daten des Abgeordneten
        content:
          application/json:
            example: |-
              {
