                            "beruf": "Diplom-Soziologe",
                            "nachname": "Post",
                            "adelssuffix": "",
                            "partei": "SPD",
                            "akademischer_titel": "",
                            "reden_ids": [
                                "ID1913000900",
                                "ID206300700",
                                "ID203700700",
                                "ID19404000"
                            ],
                            "mandate": [
                                {
                                    "end_date": "",
                                    "wahlperiode": 20,
                                    "mandatsart": "DIREKTWAHL",
                                    "start_date": "2021-10-26"
                                },
                                {
                                    "end_date": "2021-10-26",
                                    "wahlperiode": 19,
                                    "mandatsart": "DIREKTWAHL",
                                    "start_date": "2017-10-24"
                                }
                            ],
                            "institutionen": [
                                {
                                    "funktion": "Stellvertretendes Mitglied",
                                    "titel": "Haushaltsausschuss",
                                    "inst_art": "Ausschuss",
                                    "start_date": "2021-12-15"
                                },
                                {
                                    "funktion": "Ordentliches Mitglied",
                                    "titel": "Hauptausschuss",
                                    "inst_art": "Ausschuss",
                                    "start_date": "2021-11-11"
                                }
                            ],
                            "pictures": [],
                            "vita": "1978 Abitur am ...",
                            "fraktionsmitgliedschaften": [
                                {
                                    "end_date": "",
                                    "fraktion": "Fraktion der Sozialdemokratischen Partei Deutschlands",
                                    "wahlperiode": 20,
                                    "start_date": "2021-12-09"
                                },
                                {
                                    "end_date": "2021-10-26",
                                    "fraktion": "Fraktion der Sozialdemokratischen Partei Deutschlands",
                                    "wahlperiode": 19,
                                    "start_date": "2017-12-05"
                                }
                            ]
                            
                        }
      tags:
        - Abgeordnete
  /parliamentbrowser/api/data/speakers/speech-distribution:
    description: Für die Darstellung in den Diagrammen
    get:
      summary: Gibt die Anzahl der Reden pro Abgeordneten und deren Bilder zurück
      parameters:
        - name: text
          in: query
          description: Gibt alle Abgeordneten zurück in deren Rede der Text vorkommt
          schema:
            type: string
        - name: fromDate
          in: query
          description: >-
            Gibt alle Abgeordneten und die Anzahl Ihrer Reden, die nach dem
            Datum gehalten wurden
          schema:
            type: string
            example: "2017-12-21"
        - name: toDate
          in: query
          description: >-
            Gibt alle Abgeordneten und die Anzahl Ihrer Reden, die bis zu dem
            Datum gehalten wurden
          schema:
            type: string
            example: "2018-06-23"
      responses:
        "200":
          description: Erfolgreiche Anfrage
          content:
            application/json:
              examples:
                speech-distribution:
                  value: |-
                    [
                        {
                            "picture_url": "data/pictures/placeholder.jpg",
                            "vorname": "Erwin",
                            "nachname": "Rüddel",
                            "id": 11004139,
                            "speechesCount": 38
                        },
                        {
                            "picture_url": "data/pictures/11004285/representativeNr1.jpg",
                            "vorname": "Fritz",
                            "nachname": "Güntzler",
                            "id": 11004285,
                            "speechesCount": 82
                        }
                    ]
      tags:
        - Abgeordnete
        - Charts

  /reden:
    description: Eine Seite des Frontends
    get:
      summary: Gibt Java Objekte für Freemarker zurück (alle Reden bzw Sitzungen)
      description: Gibt etweder Sitzungs Objekte mit Tagesordnungspunkten zurück oder alle Reden, welche das Wort des Parameters text beinhalten
      parameters:
        - name: text
          in: query
          description: der Text/ das Wort das in den Reden vorkommen soll
          schema:
            type: string
      responses:
        "200":
          description: Erfolgreiche Anfrage
      tags:
        - Rede
        - Sitzung
  /reden/{id}:
    description: Eine Seite des Frontends
    get:
      summary: Gibt eine Rede als Java-Objekt für Freemarker zurück
      parameters:
        - name: id
          in: path
          required: true
          description: die ID der Rede
          schema:
            type: string
            example: ID1910011100
      responses:
        "200":
          description: Erfolgreiche Anfrage
      tags:
        - Rede
        - Sitzung
  /edit/rede:
    description: Eine Seite des Frontends
    get:
      summary: Gibt Java Objekte für Freemarker zurück (Rede zum bearbeiten)
      description: Entweder wird eine Template gerendert um eine neue Rede zu erstellen oder eine bereits erstellte Rede wird geladen zum editieren
      parameters:
        - name: id
          in: query
          description: Id der Rede
          schema:
            type: string
            example: ID1910011100
      responses:
        "200":
          description: Erfolgreiche Anfrage
      tags:
        - Rede
        - Sitzung
  /parliamentbrowser/api/data/speeches:
    description: Es werden Reden zurückgegeben
    get:
      summary: Reden, die den Parametern entsprechen werden zurückgegeben
      parameters:
        - name: top
          in: query
          description: nummer des Tagesordnungspunktes
          schema:
            type: integer
            format: int32
        - name: sitzung
          in: query
          description: nummer der Sitzung
          schema:
            type: integer
            format: int32
        - name: wp
          in: query
          description: nummer der Wahlperiode (da die Nummerierung der Sitzung pro Wahlperiode von neuem beginnt)
          schema:
            type: integer
            format: int32

      responses:
        "200":
          description: Erfolgreiche Anfrage
      tags:
        - Rede
  /parliamentbrowser/api/data/speeches/entities:
    description: Für die Darstellung in den Diagrammen
    get:
      summary: Die NamedEntities die in den Reden vorkommen, mit Anzahl
      parameters:
        - name: text
          in: query
          description: nur die Reden mit dem Text/Wort werden beachtet
          schema:
            type: string
        - name: fromDate
          in: query
          description: nur die Reden ab dem Datum werden beachtet
          schema:
            type: string
            example: "2017-12-21"
        - name: toDate
          in: query
          description: nur die Reden bis zu dem Datum werden beachtet
          schema:
            type: string
            example: "2018-06-23"
      responses:
        "200":
