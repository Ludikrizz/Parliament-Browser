                          },
                          {
                              "funktion": "Ordentliches Mitglied",
                              "titel": "Hauptausschuss",
                              "inst_art": "Ausschuss",
                              "start_date": "2021-11-11"
                          }
                      ],
                      "pictures": [],
                      "vita": "1978 Abitur am ...",
                      "fraktionsmitgliedschaften": [
                          {
                              "end_date": "",
                              "fraktion": "Fraktion der Sozialdemokratischen Partei Deutschlands",
                              "wahlperiode": 20,
                              "start_date": "2021-12-09"
                          },
                          {
                              "end_date": "2021-10-26",
                              "fraktion": "Fraktion der Sozialdemokratischen Partei Deutschlands",
                              "wahlperiode": 19,
                              "start_date": "2017-12-05"
                          }
                      ]
                      
                  }
      responses:
        "200":
          description: Erfolgreiche Anfrage
          content:
            application/json:
              example: { "message": "Representative editet", "id": 11003848 }
        "401":
          description: Der user ist nicht eingelogt
        "403":
          description: Der User hat nicht das Recht einen Abgeordneten zu erstellen oder zu editieren
      tags:
        - Abgeordnete
  /parliamentbrowser/api/data/representative/delete:
    description: API Endpunkt um einen neuen Abgeordeten zu löschen
    delete:
      summary: der Abgeordnete mit der ID wird gelöscht
      parameters:
        - name: id
          in: query
          description: id des zu löschenden Abgeordneten
          required: true
          schema:
            type: integer
            format: int32

      responses:
        "200":
          description: Erfolgreiche Anfrage/Löschung
        "401":
          description: Der user ist nicht eingelogt
        "403":
          description: Der User hat nicht das Recht einen Abgeordneten zu löschen
      tags:
        - Abgeordnete
  /parliamentbrowser/api/data/representatives:
    description: "Returns all Representatives from the German Parliament "
    get:
      summary: Gibt alle Abgeordneten zurück
      description: >-
        Gibt einen Abgeordneten bei Übergabe der ID zurück oder mehrere in einer
        Liste, wenn keine ID übergeben wird
      parameters:
        - name: id
          in: query
          description: Gibt den Abgeordneten mit angegebener ID zurück
          schema:
            type: integer
            format: int32
        - name: partei
          in: query
          description: Gibt alle Abgeordneten der Partei zurück
          schema:
            type: string
        - name: wahlperidoe
          in: query
          description: Gibt alle Abgeordneten der Wahlperiode  zurück
          schema:
            type: integer
            format: int32
            enum:
              - 19
              - 20
      responses:
        "200":
          description: Erfolgreiche Anfrage
          content:
            application/json:
              examples:
                Abgeordneter:
                  value: |-
                    {
                            "_id": 11004378,
                            "vorname": "Achim",
                            "anrede": "",
                            "geburtsort": "Rahden",
                            "geschlecht": "MAENNLICH",
                            "sterbedatum": "",
