                        {
                            "score": 0.8074857142857143,
                            "label": "neu"
                        }
                    ],
                    "_id": "ID2010007300",
                    "abgeordneter": 11005084,
                    "text": "Sehr geehrte Frau Präsidentin! Liebe Kolleginnen und Kollegen! Den bisherigen Reden konnten wir entnehmen, dass sich die AfD überhaupt nicht für den Verbraucherschutz interessiert und sich stattdessen lieber mit Genderfragen auseinandersetzt und dass sich die Union letztendlich auch nicht auf die Seite von Verbraucherinnen und Verbrauchern schlägt. Wir tun das als SPD; denn uns ist das wichtig. Meine Damen und Herren, stellen Sie sich vor, Ihre Bank verlangt zu hohe Gebühren von Ihnen, Ihr Internetanbieter hält die vereinbarten Leistungen nicht ein, oder Sie erwerben ein mangelhaftes Produkt. Wenn wir ein paar Jahre zurückdenken, an den Skandal um die Abschalteinrichtungen in Dieselfahrzeugen – das wurde schon erwähnt –, so hat dieser Skandal nicht nur international für Aufsehen gesorgt, sondern uns auch den Handlungsbedarf im Hinblick auf Verbraucherrechte aufgezeigt. Fakt ist doch, dass rechtswidriges und verbraucherschädigendes Verhalten von Unternehmen immer wieder vorkommt. Und schlimm ist, wenn sie damit durchkommen, weil Verbraucherinnen und Verbraucher sich nicht dagegen wehren. Es geht eben nicht nur um Einzelfälle, sondern auch um Fälle, wo massenweise Verbraucherinnen und Verbraucher betroffen sind. Es ist schlicht die Pflicht von Unternehmen, sich an Recht und Gesetz zu halten. Und wenn sie es nicht tun, dann liegt es in unserem Interesse als Gesellschaft, den Geschädigten zu helfen und dafür zu sorgen, dass sie zu ihrem Recht kommen. Meine Damen und Herren, wir haben es hier häufig mit einem ungleichen Kräfteverhältnis zu tun – es wurde schon beschrieben –: auf der einen Seite den einzelnen Verbraucher oder die Verbraucherin und auf der anderen Seite häufig das große Unternehmen mit eigener Rechtsabteilung. Natürlich fragen sich die Geschädigten dann auch: Habe ich eigentlich die Zeit und die Kraft, die Ressourcen und auch das Geld, mich in einem langwierigen, meistens jahrelangen Klageverfahren dagegen aufzulehnen? Häufig ist die Antwort dann: Nein. Und das kann ich auch sehr gut nachvollziehen. Deswegen ist es wichtig, an dieser Stelle die Kräfte zu bündeln. Mit der Musterfeststellungsklage 2018 ist ein richtiger Schritt in diese Richtung gegangen worden; denn es gibt seitdem das unbürokratische Anschließen an Klagen, die bereits von Verbraucherverbänden in die Wege geleitet wurden. Das Problem ist – es wurde bereits beschrieben –: Der Schadensersatz muss jedoch noch individuell eingeklagt werden. Die EU-Verbandsklagenrichtlinie geht jetzt genau diesen einen fehlenden Schritt weiter und ist deswegen ein Meilenstein im Verbraucherschutz. Meine Kollegin Luiza Licina-Bode hat schon einiges zum Gesetzentwurf gesagt. Für mich als Verbraucherpolitikerin ist entscheidend, dass wir die EU-Richtlinie möglichst verbraucherfreundlich umsetzen und die Nutzung dieses Klageverfahrens auch ermöglichen. Denn genau dafür ist sie auch gedacht: möglichst viele Menschen zu erreichen und damit die Gerichte von Individualklagen zu entlasten. Ich bin froh, dass der Bundesminister der Justiz die Kritikpunkte, die es bereits früh gab, aufgenommen hat. Dazu gehörten die Verschiebung des Zeitpunktes, sich dem Verfahren anschließen zu können, und auch die Senkung der Hürden für klageberechtigte Verbände. Aus verbraucherpolitischer Sicht ist allerdings durchaus noch Luft nach oben. Die Anzahl der glaubhaft zu machenden Fälle ist aus meiner Sicht mit 50 noch zu hoch; das wird uns auch aus der Praxis so gemeldet. Und es sollte auch möglich sein, sich noch nach Abschluss eines Verfahrens im Nachhinein und jederzeit anschließen, letztendlich davon profitieren und das eigene Recht geltend machen zu können. Denn geschädigt bleibt nun mal geschädigt. Ich bin deshalb sehr gespannt auf die weiteren Beratungen und bringe mich dabei gerne selbst ein. Herzlichen Dank. ",
